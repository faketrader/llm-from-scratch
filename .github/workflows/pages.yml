name: Build and deploy book
on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'web/**'
      - 'Makefile'
      - '.latexmkrc'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: danteev/texlive:2026-09-01
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Restore generated figure PDFs
        id: figure-cache
        uses: actions/cache@v6
        with:
          path: book/figures/theory/*.pdf
          key: texlive-20260901-figures-${{ hashFiles('book/figures/theory/*.tex', 'book/my-math.sty', 'book/my-fontset.tex', 'Makefile') }}
      - name: Refresh cached figure timestamps
        if: steps.figure-cache.outputs.cache-hit == 'true'
        run: find book/figures/theory -maxdepth 1 -type f -name '*.pdf' -exec touch {} +
      - name: Install pnpm
        run: npm install --global pnpm@12
      - name: Install web dependencies
        run: make web/node_modules/.my-installed
      - name: Typecheck web
        run: pnpm --dir web typecheck
      - name: Build web
        run: make -j2 web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
