name: Build and deploy book
on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'web/**'
      - 'Makefile'
      - '.latexmkrc'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: danteev/texlive:2026-09-01@sha256:9a20c37c672a5466670609f550a2a04e99368fc94e33f5287b174fe8519eb6a6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@12.4.2
      - name: Install PDF conversion backend
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends mupdf-tools
      - name: Build and validate
        env:
          DVISVGM_PDF_PROC: mutool
        run: |
          make web/node_modules/.lfs-installed
          pnpm --dir web typecheck
          make web
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/web
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
