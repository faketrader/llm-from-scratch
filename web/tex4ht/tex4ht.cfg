\Preamble{xhtml,mathjax,fn-in}
% Complete the unicode-math adapter for formulas typeset inside TikZ pictures.
% TeX4ht supplies symup but leaves symbfit undefined.
\ProvideDocumentCommand{\symbfit}{m}{\boldsymbol{#1}}
% TeX4ht's ctexart hook bypasses CTEX's engine/font files. Register CJK
% through TeX4ht's supported Unicode bridge instead of selecting PDF fonts.
\ifdefined\XeTeXversion
  \xeuniuseblock{CJK}
\fi
% Preserve semantic colon-bearing URLs already resolved by the publisher.
\DeclareFieldFormat{eprint:arxiv}{\href{https://arxiv.org/abs/#1}{#1}}
\renewcommand{\hypertarget}[2]{\HCode{<a id="#1"></a>}#2}
\Configure{section}{}{}{\ifvmode\IgnorePar\fi\EndP\HCode{<h1 id="section-\thesection">}\NoFonts}{\EndNoFonts\HCode{</h1>}\IgnoreIndent\par}
\newcounter{lfswebstar}
\Configure{likesection}{}{}{\ifvmode\IgnorePar\fi\EndP\stepcounter{lfswebstar}\HCode{<h1 class="unnumbered" id="reading-\arabic{lfswebstar}">}\NoFonts}{\EndNoFonts\HCode{</h1>}\IgnoreIndent\par}
\Configure{subsection}{}{}{\ifvmode\IgnorePar\fi\EndP\HCode{<h2 id="section-\thesubsection">}\NoFonts}{\EndNoFonts\HCode{</h2>}\IgnoreIndent\par}
\Configure{subsubsection}{}{}{\ifvmode\IgnorePar\fi\EndP\HCode{<h3 id="section-\thesubsubsection">}\NoFonts}{\EndNoFonts\HCode{</h3>}\IgnoreIndent\par}
\Configure{textbf}{\HCode{<strong>}\NoFonts}{\EndNoFonts\HCode{</strong>}}
\Configure{texttt}{\HCode{<code>}\NoFonts}{\EndNoFonts\HCode{</code>}}
\Configure{textit}{\HCode{<em>}\NoFonts}{\EndNoFonts\HCode{</em>}}
\Configure{emph}{\HCode{<em>}\NoFonts}{\EndNoFonts\HCode{</em>}}
\ConfigureEnv{quote}{}{}{\ifvmode\IgnorePar\fi\EndP\HCode{<blockquote>}\ShowPar}{\ifvmode\IgnorePar\fi\EndP\HCode{</blockquote>}\ShowPar}
% HTML has no floating page-placement model. Emit figures and tables in source
% order and keep the caption package's semantic caption handling.
\makeatletter
\RenewDocumentEnvironment{figure}{O{}}{%
  \par\begingroup\def\@captype{figure}%
  \HCode{<figure class="figure">}%
}{%
  \HCode{</figure>}\endgroup\par
}
\RenewDocumentEnvironment{figure*}{O{}}{%
  \par\begingroup\def\@captype{figure}%
  \HCode{<figure class="figure">}%
}{%
  \HCode{</figure>}\endgroup\par
}
\RenewDocumentEnvironment{table}{O{}}{%
  \par\begingroup\def\@captype{table}%
  \HCode{<figure class="table-figure">}%
}{%
  \HCode{</figure>}\endgroup\par
}
\RenewDocumentEnvironment{table*}{O{}}{%
  \par\begingroup\def\@captype{table}%
  \HCode{<figure class="table-figure">}%
}{%
  \HCode{</figure>}\endgroup\par
}
% TeX4ht's page-oriented \clearpage can repeatedly ship empty pages after a
% long ctexbook. HTML has already been emitted synchronously, so switch to a
% single \newpage before LaTeX starts the end-document page builder.
\AddToHook{begindocument/end}{%
  \let\lfswebenddocument\enddocument
  \def\enddocument{%
    \def\@kernel@before@enddocument{}%
    \let\clearpage\relax
    \lfswebenddocument
  }%
}
\makeatother
% TeX4ht isolates TikZ output into vector pictures instead of mixing PGF
% specials into the document stream.
\ConfigureEnv{tikzpicture}{\Picture+{}}{\EndPicture}{}{}
% TeX Live 2026 biblatex stores the auxiliary refcontext in the @aux@
% namespace; the TeX4ht XeTeX adapter still writes the older namespace.
\makeatletter
\def\abx@aux@defaultrefcontext#1#2#3{%
  \csxdef{blx@assignedrefcontextbib@aux@#1@\detokenize{#2}}{\detokenize{#3}}}
\makeatother
\begin{document}
\EndPreamble
